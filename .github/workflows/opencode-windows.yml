name: OpenCode Windows test build

on:
  workflow_dispatch:
  push:
    branches: [opencode-integration]
    paths:
      - 'windows/**'
      - '.github/workflows/opencode-windows.yml'

permissions:
  contents: read

concurrency:
  group: opencode-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: windows
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx --no-install tsc --noEmit

      - name: JavaScript tests
        run: npm test

      - name: Build relay
        run: cargo build --release --locked -p coucou-hook

      - name: Native Rust tests
        run: cargo test --workspace --locked

      - name: Build Windows app without publishing or installers
        run: npm run tauri -- build --no-bundle

      - name: Record artifact checksums
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @('target/release/coucou.exe', 'target/release/coucou-hook.exe')
          $lines = foreach ($path in $paths) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $path
            "$($hash.Hash.ToLowerInvariant())  $(Split-Path -Leaf $path)"
          }
          $lines | Set-Content -Encoding ascii target/release/SHA256SUMS.txt
          "Reviewed commit: $env:GITHUB_SHA" | Set-Content target/release/BUILD-REF.txt

      - name: Upload portable test build
        uses: actions/upload-artifact@v7
        with:
          name: Coucou-OpenCode-Windows-${{ github.sha }}
          path: |
            windows/target/release/coucou.exe
            windows/target/release/coucou-hook.exe
            windows/target/release/SHA256SUMS.txt
            windows/target/release/BUILD-REF.txt
          if-no-files-found: error
          retention-days: 3
