name: Windows CI

# Type-checks and tests the Windows app on every pull request that touches it.
# Dev pushes also produce test installers as artifacts, never releases.

on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  push:
    branches: [main, dev]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The tests run the TypeScript sources directly, which needs Node 22.18
      # or newer; 24 is the version they are run with locally.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-ci-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-ci-cargo-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Island tests
        run: npm test

      # The app bundles target/release/coucou-hook.exe as a resource, and its
      # build script refuses to run until that file exists. One command per
      # step: PowerShell carries on after a failed command in the same step.
      - name: Build the relay
        run: cargo build --release -p coucou-hook

      - name: Rust tests
        shell: pwsh
        run: |
          cargo test --workspace --locked 2>&1 | Tee-Object -FilePath rust-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Rust diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-rust-diagnostics
          path: windows/rust-tests.log
          retention-days: 3

      - name: Build Windows test installers
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: npm run pack

      - name: Upload Windows test installers
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: actions/upload-artifact@v7
        with:
          name: Coucou-Windows-dev-${{ github.sha }}
          path: |
            windows/release/*.exe
            windows/release/*.msi
          if-no-files-found: error
          retention-days: 3
